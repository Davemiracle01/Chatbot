<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subra — Usanifu na Sanaa</title>
<style>
  :root{
    --bg1:#ffeaf7; --bg2:#eaf1ff;
    --accent:#ff7ac6; --accent2:#6fc6ff; --gem:#b18cff;
    --glass:rgba(255,255,255,0.38); --glass-border:rgba(255,255,255,0.75);
    --text:#2c1b45; --text-dim:rgba(44,27,69,.62);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top: env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(177,140,255,.38), transparent 50%),
      radial-gradient(circle at 85% 25%, rgba(255,122,198,.32), transparent 55%),
      radial-gradient(circle at 50% 90%, rgba(111,198,255,.32), transparent 55%),
      linear-gradient(170deg, var(--bg1), var(--bg2));
    background-attachment:fixed; color:var(--text); font-family:-apple-system, system-ui, sans-serif;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  section{ padding:80px 24px; max-width:640px; margin:0 auto; }

  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(255,122,198,.55); }
    70%{ box-shadow:0 0 0 18px rgba(255,122,198,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,122,198,0); }
  }

  .hero{ min-height:92vh; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .hero .loc{ font-size:.8rem; color:var(--text-dim); letter-spacing:.04em; margin-bottom:14px; }
  .hero h1{
    font-size:clamp(2.4rem, 11vw, 3.6rem); margin:0 0 14px; line-height:1.05; font-weight:800;
    background:linear-gradient(100deg,var(--gem),var(--accent) 55%,var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ font-size:1.05rem; color:var(--text-dim); max-width:420px; margin:0 auto 28px; line-height:1.5; }
  a.cta{
    display:inline-block; padding:13px 28px; border-radius:999px; text-decoration:none;
    background:linear-gradient(90deg,var(--accent),var(--gem)); color:#fff; font-weight:700; font-size:.9rem;
    box-shadow:0 10px 30px rgba(177,140,255,.4);
  }

  .about h2{ font-size:1.6rem; margin:0 0 16px; }
  .about p{ color:var(--text-dim); line-height:1.6; font-size:1rem; }
  .about .tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .about .tag{
    padding:6px 14px; border-radius:999px; font-size:.78rem; color:var(--text);
    background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
  }

  .work h2{ font-size:1.6rem; margin:0 0 6px; padding:0 24px; max-width:640px; margin-left:auto; margin-right:auto; }
  .work .sub{ color:var(--text-dim); font-size:.9rem; margin:0 0 28px; padding:0 24px; max-width:640px; margin-left:auto; margin-right:auto; }
  .track{ display:flex; gap:18px; overflow-x:auto; scroll-snap-type:x mandatory; padding:26px 10vw 34px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .track::-webkit-scrollbar{display:none;}
  .card{
    flex:0 0 72vw; max-width:280px; scroll-snap-align:center;
    background:var(--glass); border:1px solid var(--glass-border); border-radius:26px;
    backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
    box-shadow:0 16px 44px rgba(130,100,255,.22), inset 0 1px 0 rgba(255,255,255,.8);
    padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer;
    animation: float 4.5s ease-in-out infinite;
  }
  .card:nth-child(even){ animation-delay:-2.2s; }
  .card:nth-child(3n){ animation-delay:-1.1s; }
  .card img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:18px; display:block; }
  .card h3{ margin:0; font-size:1.05rem; color:var(--text); }
  .dots{ display:flex; gap:6px; justify-content:center; }
  .dot{ width:6px; height:6px; border-radius:50%; background:rgba(44,27,69,.25); transition:.2s; }
  .dot.active{ background:var(--gem); width:18px; border-radius:3px; }

  .skeleton{ flex:0 0 72vw; max-width:280px; aspect-ratio:3/4; border-radius:26px;
    background:linear-gradient(100deg, rgba(255,255,255,.3) 30%, rgba(255,255,255,.65) 50%, rgba(255,255,255,.3) 70%);
    background-size:200% 100%; animation:shimmer 1.4s infinite; }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .contact{ text-align:center; padding-bottom:100px; }
  .contact h2{ font-size:1.6rem; margin:0 0 10px; }
  .contact p{ color:var(--text-dim); margin:0 0 22px; }
  footer{ text-align:center; color:rgba(44,27,69,.4); font-size:.75rem; padding:20px 0 40px; }

  .secnav{ position:fixed; right:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:40; }
  .secnav button{ width:8px; height:8px; border-radius:50%; background:rgba(44,27,69,.25); border:none; padding:0; }
  .secnav button.active{ background:var(--gem); height:22px; border-radius:4px; }

  .lightbox{ position:fixed; inset:0; background:rgba(255,245,252,.85); backdrop-filter:blur(10px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:env(safe-area-inset-top,20px) 16px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:90vw; max-height:78vh; border-radius:20px; box-shadow:0 24px 70px rgba(130,100,255,.35); }
  .lb-close,.lb-prev,.lb-next{
    position:fixed; background:var(--glass); border:1px solid var(--glass-border); color:var(--text);
    width:42px; height:42px; border-radius:50%; font-size:1.1rem; backdrop-filter:blur(16px); cursor:pointer;
  }
  .lb-close{ top:calc(env(safe-area-inset-top,16px) + 16px); right:16px; }
  .lb-prev{ left:12px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:12px; top:50%; transform:translateY(-50%); }

  /* ---- AI chat widget — made prominent ---- */
  #chatToggle{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,16px) + 18px); right:18px; z-index:150;
    width:66px; height:66px; border-radius:50%; border:2px solid rgba(255,255,255,.8);
    background:linear-gradient(135deg,var(--accent),var(--gem) 60%,var(--accent2));
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 34px rgba(177,140,255,.5); cursor:pointer;
    animation: pulseRing 2.6s infinite, float 3.2s ease-in-out infinite;
  }
  #chatToggle svg{ width:28px; height:28px; }
  #chatPanel{
    position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom,16px) + 94px);
    width:min(340px, 90vw); height:min(460px, 65vh);
    background:rgba(255,255,255,.45); border:1px solid var(--glass-border); border-radius:26px;
    backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
    box-shadow:0 26px 70px rgba(130,100,255,.35); z-index:150;
    display:none; flex-direction:column; overflow:hidden;
  }
  #chatPanel.open{ display:flex; }
  .chat-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--glass-border); }
  .chat-head span{ font-weight:700; font-size:.95rem; color:var(--text); }
  .chat-head button{ background:none; border:none; color:var(--text-dim); font-size:1.1rem; cursor:pointer; }
  #chatMessages{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .crow{ max-width:85%; padding:9px 13px; border-radius:14px; font-size:.88rem; line-height:1.4; }
  .crow.cbot{ align-self:flex-start; background:rgba(255,255,255,.55); border:1px solid var(--glass-border); color:var(--text); border-bottom-left-radius:4px; }
  .crow.cuser{ align-self:flex-end; background:linear-gradient(90deg,var(--accent),var(--gem)); color:#fff; border-bottom-right-radius:4px; }
  #chatForm{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--glass-border); }
  #chatInput{ flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--text); font-size:.88rem; outline:none; }
  #chatForm button[type="submit"]{ padding:0 16px; border:none; border-radius:10px; background:linear-gradient(90deg,var(--accent2),var(--gem)); color:#fff; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

  <nav class="secnav" id="secnav">
    <button data-target="hero" class="active" aria-label="Mwanzo"></button>
    <button data-target="about" aria-label="Kuhusu"></button>
    <button data-target="work" aria-label="Kazi"></button>
    <button data-target="contact" aria-label="Wasiliana"></button>
  </nav>

  <section class="hero" id="hero">
    <div class="loc">Tanzania</div>
    <h1>Subra</h1>
    <p>karibu subratech.</p>
    <a class="cta" href="#work">Ona kazi ↓</a>
  </section>

  <section class="about" id="about">
    <h2>Kuhusu</h2>
    <p>🇹🇿</p>
    <div class="tags">
      <span class="tag">Sanaa ya Kidijitali</span>
      <span class="tag">Uundaji wa Chapa</span>
      <span class="tag">Dhana za UI</span>
      <span class="tag">Michoro</span>
    </div>
  </section>

  <section class="work" id="work">
    <h2>Kazi</h2>
    <p class="sub">Telezesha kidole kuona zaidi — gusa kipande kukikuza</p>
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="contact" id="contact">
    <h2>Tushirikiane</h2>
    <p>Niko tayari kwa ushirikiano, kazi za kuagizwa, na miradi mipya.</p>
    <a class="cta" href="mailto:hello@subra.art">Wasiliana nami</a>
  </section>

  <footer>© Subra</footer>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-prev" id="lbPrev">‹</button>
    <img id="lbImg">
    <button class="lb-next" id="lbNext">›</button>
  </div>

  <!-- AI chat widget -->
  <button id="chatToggle" aria-label="Fungua mazungumzo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>
  <div id="chatPanel">
    <div class="chat-head">
      <span>chat AI</span>
      <button id="chatClose">✕</button>
    </div>
    <div id="chatMessages"></div>
    <form id="chatForm">
      <input id="chatInput" type="text" placeholder="Andika swali lako..." maxlength="500" autocomplete="off">
      <button type="submit">Tuma</button>
    </form>
  </div>

<script>
  const EXT = 'jpg';
  const MAX_CHECK = 50;
  const titles = {};

  const track = document.getElementById('track');
  const dotsEl = document.getElementById('dots');
  let urls = [];

  function fileExists(url){
    return new Promise(res=>{
      const img = new Image();
      img.onload = ()=>res(true);
      img.onerror = ()=>res(false);
      img.src = url;
    });
  }

  for(let i=0;i<3;i++){
    const s = document.createElement('div');
    s.className = 'skeleton';
    track.appendChild(s);
  }

  async function loadPics(){
    let n = 1;
    while(n <= MAX_CHECK){
      const url = `pics/${n}.${EXT}`;
      const ok = await fileExists(url);
      if(!ok) break;
      urls.push(url);
      n++;
    }
    track.innerHTML = '';
    if(urls.length === 0){
      track.innerHTML = '<p style="padding:30px 10px;color:rgba(44,27,69,.55)">Hakuna picha zilizopatikana katika pics/ — ongeza pics/1.jpg, pics/2.jpg, n.k.</p>';
      return;
    }
    urls.forEach((url,i)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${url}" loading="lazy"><h3>${titles[i+1] || ' carousel test ' + (i+1)}</h3>`;
      card.addEventListener('click', ()=> openLightbox(i));
      track.appendChild(card);
    });
    buildDots();
  }

  function buildDots(){
    [...track.children].forEach((_,i)=>{
      const d = document.createElement('div');
      d.className = 'dot' + (i===0?' active':'');
      dotsEl.appendChild(d);
    });
    track.addEventListener('scroll', ()=> requestAnimationFrame(updateDots));
    updateDots();
  }

  function updateDots(){
    const cards = [...track.children];
    const dots = [...dotsEl.children];
    const center = track.scrollLeft + track.clientWidth/2;
    let closest = 0, min = Infinity;
    cards.forEach((c,i)=>{
      const d = Math.abs((c.offsetLeft + c.offsetWidth/2) - center);
      if(d < min){ min = d; closest = i; }
    });
    dots.forEach((d,i)=> d.classList.toggle('active', i===closest));
  }

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  let lbIndex = 0;
  function openLightbox(i){ lbIndex = i; lbImg.src = urls[i]; lightbox.classList.add('open'); }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function step(d){ lbIndex = (lbIndex + d + urls.length) % urls.length; lbImg.src = urls[lbIndex]; }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', ()=>step(-1));
  document.getElementById('lbNext').addEventListener('click', ()=>step(1));
  lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });

  const navBtns = [...document.querySelectorAll('.secnav button')];
  navBtns.forEach(b=> b.addEventListener('click', ()=>{
    document.getElementById(b.dataset.target).scrollIntoView({behavior:'smooth'});
  }));
  const sections = navBtns.map(b=> document.getElementById(b.dataset.target));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const idx = sections.indexOf(entry.target);
        navBtns.forEach((b,i)=> b.classList.toggle('active', i===idx));
      }
    });
  }, { threshold:.5 });
  sections.forEach(s=> io.observe(s));

  loadPics();

  // ---- AI chat widget ----
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  let chatHistory = [];

  function addChatBubble(text, who){
    const row = document.createElement('div');
    row.className = 'crow ' + who;
    row.textContent = text;
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return row;
  }

  chatToggle.addEventListener('click', ()=>{
    chatPanel.classList.toggle('open');
    if(chatPanel.classList.contains('open') && chatMessages.children.length === 0){
      addChatBubble("Habari! Niulize chochote kuhusu kazi za Subra.", 'cbot');
    }
  });
  chatClose.addEventListener('click', ()=> chatPanel.classList.remove('open'));

  chatForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const text = chatInput.value.trim();
    if(!text) return;
    addChatBubble(text, 'cuser');
    chatHistory.push({ role:'user', content:text });
    chatInput.value = '';
    const typing = addChatBubble('...', 'cbot');
    try{
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ message:text, history: chatHistory.slice(0,-1) })
      });
      const data = await res.json();
      typing.remove();
      const reply = data.reply || data.error || "Samahani, jaribu tena.";
      addChatBubble(reply, 'cbot');
      chatHistory.push({ role:'assistant', content:reply });
    }catch(err){
      typing.remove();
      addChatBubble("Tatizo la muunganisho — jaribu tena.", 'cbot');
    }
  });
</script>
</body>
</html>
